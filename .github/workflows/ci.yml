name: Build and security checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate scripts
        run: |
          for script in scripts/*.sh; do zsh -n "$script"; done
          python3 -m py_compile scripts/check-security.py
          plutil -lint Resources/Info.plist Resources/TopBar.entitlements
      - name: Functional and adversarial input checks
        run: zsh scripts/test.sh
      - name: Build sandboxed application and verify protections
        run: zsh scripts/build.sh
      - name: Verify sandbox isolation and local metric access
        env:
          BARLUMA_REQUIRE_NETWORK: '1'
        run: zsh scripts/sandbox-smoke.sh
      - name: Build and inspect unsigned user-only preview installer
        run: zsh scripts/package-preview.sh

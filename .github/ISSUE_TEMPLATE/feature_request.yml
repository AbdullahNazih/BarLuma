name: Suggest a feature
description: Tell us what would make BarLuma more useful.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or use case.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Explain the behavior you would find useful.
    validations:
      required: true
